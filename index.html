<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ассоциации</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* FIX: touch-action:none убран из глобального селектора — именно он блокировал скролл.
           Он остаётся только на .drag-word, где реально нужен для drag-and-drop. */
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg:#f5f5f5;--surface:#fff;--primary:#2481cc;--primary-dark:#1a6cb3;--text:#000;--text-secondary:#707579;--border:#dfe1e5;--error:#e74c3c;--success:#2ecc71;--warning:#f39c12;--shadow:0 2px 8px rgba(0,0,0,.08)}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;touch-action:pan-y}
        .container{max-width:480px;margin:0 auto;padding:16px;min-height:100vh;position:relative}

        .header{text-align:center;margin-bottom:16px;padding-top:8px;position:relative}
        .header h1{font-size:24px;font-weight:800;margin-bottom:4px}
        .header p{color:var(--text-secondary);font-size:13px}
        .badges-row{position:absolute;top:0;right:0;display:flex;gap:6px;align-items:center}
        .streak-badge{display:none;background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(238,90,36,.3)}
        .streak-badge.active{display:block}
        .wins-badge{display:none;background:linear-gradient(135deg,#f1c40f,#f39c12);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(243,156,18,.3)}
        .wins-badge.active{display:block}
        .version{position:absolute;bottom:-4px;right:0;font-size:11px;color:var(--text-secondary);font-weight:600;opacity:.7}

        .nav-tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow)}
        .nav-tab{flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
        .nav-tab.active{background:var(--primary);color:#fff}

        .tab-content{display:none;animation:fadeIn .3s ease}
        .tab-content.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

        .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
        .photo-card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);position:relative;animation:fadeIn .3s ease;display:flex;flex-direction:column}
        .photo-card .img-wrap{width:100%;aspect-ratio:3/4;max-height:220px;background:rgba(0,0,0,.04);overflow:hidden;display:flex;align-items:center;justify-content:center}
        .photo-card .img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
        .photo-card .fav-btn{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.4);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .2s}
        .photo-card .fav-btn.active{background:#f1c40f}
        .photo-card .delete-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2}
        .photo-card .word-input{width:100%;border:none;padding:10px 8px;font-size:14px;text-align:center;font-weight:600;outline:none;background:transparent;border-top:1px solid var(--border);color:var(--text)}
        .photo-card .word-input::placeholder{color:#bbb;font-weight:500}
        .photo-card .prefix-input{color:var(--primary);background:rgba(36,129,204,.06);font-size:13px;font-weight:700;letter-spacing:.5px}

        .add-btn{width:100%;padding:14px 20px;border:2px solid var(--primary);border-radius:14px;background:rgba(36,129,204,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--primary);gap:8px;font-size:15px;font-weight:700;margin-bottom:16px}
        .add-btn:active{transform:scale(.98);background:var(--primary);color:#fff}
        .add-btn .icon{font-size:20px}

        .start-btn{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(36,129,204,.3);transition:all .2s;margin-bottom:10px}
        .start-btn:disabled{background:#b0b0b0;box-shadow:none;cursor:not-allowed}
        .start-btn:not(:disabled):active{transform:scale(.98);background:var(--primary-dark)}

        .reset-btn{width:100%;padding:12px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer}
        .reset-btn:active{background:rgba(0,0,0,.03)}

        .transfer-row{display:flex;gap:10px;margin-bottom:10px}
        .transfer-btn{flex:1;padding:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
        .transfer-btn:active{transform:scale(.97);border-color:var(--primary);color:var(--primary)}

        /* SELF-RATING (Прогресс) */
        .self-summary{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center}
        .self-summary-title{font-size:16px;font-weight:700;margin-bottom:4px}
        .self-summary-sub{font-size:13px;color:var(--text-secondary)}
        .self-avg{font-size:15px;margin-top:10px;color:var(--text)}
        .self-avg .up{color:var(--success);font-weight:700}
        .self-avg .down{color:var(--error);font-weight:700}
        .self-history{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
        .self-hist-title{font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:10px;font-weight:600}
        .self-hist-row{display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
        .self-hist-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
        .self-hist-bar-wrap{height:60px;width:100%;display:flex;align-items:flex-end;background:rgba(0,0,0,.05);border-radius:6px;overflow:hidden}
        .self-hist-bar{width:100%;background:var(--primary);border-radius:6px 6px 0 0;min-height:0;transition:height .3s}
        .self-hist-bar.today{background:var(--success)}
        .self-hist-day{font-size:10px;color:var(--text-secondary)}
        .self-card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
        .self-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .self-word{font-size:16px;font-weight:700;color:var(--text)}
        .self-val{font-size:18px;font-weight:800;color:var(--primary);min-width:28px;text-align:right}
        .self-slider{width:100%;accent-color:var(--primary);height:28px;cursor:pointer}
        .self-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);margin-top:2px}
        .self-prev{font-size:12px;color:var(--text-secondary);margin-top:6px}
        .self-empty{text-align:center;color:var(--text-secondary);padding:30px 16px;font-size:14px;line-height:1.5}

        .counter{display:inline-block;background:var(--primary);color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:12px}
        .counter.ready{background:var(--success)}

        .game-screen{display:none}
        .game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:4px;position:relative}
        .game-header h2{font-size:18px;flex:1;text-align:center}
        .back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-secondary);padding:4px 8px;line-height:1}
        .back-btn:active{color:var(--error)}
        .round-badge{background:var(--primary);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}

        .timer-bar{width:100%;height:6px;background:rgba(0,0,0,.08);border-radius:3px;margin-bottom:14px;overflow:hidden}
        .timer-fill{height:100%;background:var(--primary);border-radius:3px;width:100%;transition:width .1s linear}
        .timer-fill.warning{background:var(--warning)}
        .timer-fill.danger{background:var(--error)}

        .progress-bar{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
        .progress-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
        .progress-dot.active{background:var(--primary);transform:scale(1.3)}
        .progress-dot.done{background:var(--success)}
        .progress-dot.retry{background:var(--warning)}
        .progress-dot.drag{background:linear-gradient(135deg,#9b59b6,#8e44ad)}
        .progress-dot.type{background:linear-gradient(135deg,#e67e22,#d35400)}

        .hint{text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:12px;min-height:20px;font-weight:500}

        /* NORMAL ROUND */
        .game-photo-wrap{text-align:center;margin-bottom:12px}
        .game-photo-wrap img{max-width:100%;width:auto;height:auto;max-height:42vh;display:inline-block;border-radius:16px;box-shadow:var(--shadow);background:rgba(0,0,0,.04)}
        .game-photo-wrap.highlight img{outline:4px solid var(--primary);outline-offset:-4px}
        .photo-prefix{text-align:center;font-size:28px;font-weight:800;color:var(--primary);margin-bottom:16px;letter-spacing:1px}

        /* DRAG ROUND */
        .drag-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
        .drag-target{position:relative;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:3px solid transparent;transition:all .2s;aspect-ratio:3/4;max-height:180px}
        .drag-target img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
        .drag-target.highlight{border-color:var(--primary);transform:scale(1.02)}
        .drag-target.correct{border-color:var(--success)}
        .drag-target.wrong{animation:shake .4s}
        .drag-target .drag-label{position:absolute;bottom:0;left:0;right:0;background:rgba(46,204,113,.9);color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:700;transform:translateY(100%);transition:transform .2s}
        .drag-target.correct .drag-label{transform:translateY(0)}

        .drag-words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}
        .drag-word{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:grab;transition:all .15s;box-shadow:var(--shadow);user-select:none;touch-action:none;position:relative;z-index:10;color:var(--text)}
        .drag-word:active{cursor:grabbing;transform:scale(1.05);box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:1000}
        .drag-word.selected{border-color:var(--primary);background:rgba(36,129,204,.12);transform:scale(1.05);box-shadow:0 4px 14px rgba(36,129,204,.35)}
        .drag-word.matched{opacity:0;transform:scale(0);pointer-events:none}

        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

        .words-title{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:10px;font-weight:600}
        .words-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .word-btn{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:18px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;color:var(--text);touch-action:none;user-select:none}

        /* TYPE ROUND */
        .type-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:14px;font-size:17px;font-weight:600;text-align:center;outline:none;background:var(--surface);color:var(--text);margin-bottom:12px;transition:all .2s}
        .type-input:focus{border-color:var(--primary)}
        .type-input.correct{border-color:var(--success);background:rgba(46,204,113,.1);color:var(--success)}
        .type-input.wrong{border-color:var(--error);background:rgba(231,76,60,.1);color:var(--error);animation:shake .4s}
        .word-btn:active{transform:scale(.96)}
        .word-btn.correct{border-color:var(--success);background:rgba(46,204,113,.1);color:var(--success)}
        .word-btn.wrong{border-color:var(--error);background:rgba(231,76,60,.1);color:var(--error)}

        .word-bank{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
        .word-bank-hint{font-size:12px;color:var(--text-secondary);margin-bottom:14px;text-align:center;line-height:1.4}
        .word-category{margin-bottom:16px}
        .word-category h4{font-size:14px;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
        .word-chips{display:flex;flex-wrap:wrap;gap:8px}
        .word-chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text)}
        .word-chip:active{transform:scale(.95);background:var(--primary);color:#fff;border-color:var(--primary)}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:3000;opacity:0;transition:all .3s;max-width:90vw;text-align:center}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

        .training-preview{text-align:center;padding:20px}
        .training-preview p{color:var(--text-secondary);font-size:14px;margin-bottom:16px;line-height:1.5}
        .training-card{background:var(--surface);border-radius:20px;padding:24px;box-shadow:var(--shadow);text-align:center;max-width:320px;margin:0 auto}
        .training-card img{max-width:100%;width:auto;height:auto;max-height:40vh;display:inline-block;border-radius:16px;background:rgba(0,0,0,.04)}
        .training-card .training-word{font-size:22px;font-weight:800;margin:16px 0 20px;color:var(--text)}
        .training-buttons{display:flex;gap:12px;justify-content:center}
        .training-btn{width:64px;height:64px;border-radius:50%;border:none;font-size:28px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
        .training-btn.yes{background:var(--success);color:#fff}
        .training-btn.no{background:var(--error);color:#fff}
        .training-btn:active{transform:scale(.92)}
        .training-progress{text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:16px;font-weight:600}

        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
        .modal-overlay.active{display:flex;animation:fadeIn .2s}
        .modal{background:var(--surface);border-radius:24px;padding:32px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .3s ease}
        @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        .modal-icon{font-size:56px;margin-bottom:12px}
        .modal h3{font-size:22px;margin-bottom:8px}
        .modal p{color:var(--text-secondary);font-size:15px;margin-bottom:20px;line-height:1.4}
        .modal-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s}
        .modal-btn:active{transform:scale(.98)}
        .modal-btn.success{background:var(--success);color:#fff}

        .confetti{position:fixed;width:8px;height:8px;top:-10px;border-radius:2px;z-index:2000;pointer-events:none;animation:confettiFall 2.5s linear forwards}
        @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

        #fileInput{display:none}
        .saved-badge{text-align:center;font-size:12px;color:var(--success);margin-bottom:10px;font-weight:600;opacity:0;transition:opacity .3s}
        .saved-badge.show{opacity:1}

        @media(max-width:360px){.photo-card .img-wrap{max-height:180px}.drag-target{max-height:150px}}
    </style>
</head>
<body>
    <div class="container">
        <div id="setupScreen">
            <div class="header">
                <div class="badges-row">
                    <div class="wins-badge" id="winsBadge">🏆 0</div>
                    <div class="streak-badge" id="streakBadge">🔥 0</div>
                </div>
                <h1>🧠 Ассоциации</h1>
                <p>Загрузи фото и придумай к ним слова</p>
                <div class="version">v0.9</div>
                <div class="saved-badge" id="savedBadge">✅ Сохранено</div>
                <div class="counter" id="counter">Добавлено: 0/4</div>
            </div>

            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="home" onclick="switchTab('home')">🏠 Главная</button>
                <button class="nav-tab" data-tab="progress" onclick="switchTab('progress')">📊 Прогресс</button>
            </div>

            <div class="tab-content active" id="tab-home">
                <div class="photo-grid" id="photoGrid"></div>
                <div class="add-btn" onclick="document.getElementById('fileInput').click()">
                    <span class="icon">➕</span>
                    <span>Добавить фото</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
                <button class="start-btn" id="startBtn" disabled onclick="startGame()">▶️ Начать игру</button>
                <div class="transfer-row">
                    <button class="transfer-btn" onclick="exportData()">📤 Экспорт</button>
                    <button class="transfer-btn" onclick="document.getElementById('importInput').click()">📥 Импорт</button>
                    <input type="file" id="importInput" accept=".json,application/json" style="display:none" onchange="importData(this)">
                </div>
                <button class="reset-btn" id="resetBtn" style="display:none" onclick="resetAll()">🗑 Очистить всё</button>
            </div>

            <div class="tab-content" id="tab-progress">
                <div class="self-summary" id="selfSummary"></div>
                <div class="self-history" id="selfHistory"></div>
                <div id="selfList"></div>
            </div>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <button class="back-btn" onclick="exitGame()">✕</button>
                <h2 id="gameTitle">Найди слово</h2>
                <div class="round-badge" id="roundBadge">Раунд 1</div>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="progress-bar" id="progressBar"></div>
            <div class="hint" id="hint">Какое слово подходит?</div>
            <div id="gameContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="winModal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h3 id="winTitle">Победа!</h3>
            <p id="winText">Ты прошёл все раунды!</p>
            <button class="modal-btn success" onclick="closeWin()">Играть снова</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // FIX: безопасная инициализация — приложение не падает вне Telegram (например, в обычном браузере)
        const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:{ready(){},expand(){},onEvent(){},HapticFeedback:null,themeParams:{}};
        try{tg.ready();tg.expand()}catch(e){}

        const OLD_DB='AssociationsGame',NEW_DB='AssociationsGame_v3',VER=1,STORE_P='photos',STORE_M='meta';
        let photos=[],streak={count:0,lastWinDate:null},winsTotal=0,saveTimer=null;
        let selfRatings={},selfSaveTimer=null;
        let game={rounds:[],current:0,processing:false,timer:null,timeLeft:0,maxTime:12,dragMatched:0,dragTotal:0};
        let dragSelected=null,suppressClickUntil=0;

        // Тёмная тема: подхватываем цвета из Telegram и реагируем на смену темы
        function applyTheme(){const p=tg.themeParams||{};const r=document.documentElement.style;
            if(p.bg_color)r.setProperty('--bg',p.bg_color);
            if(p.secondary_bg_color)r.setProperty('--surface',p.secondary_bg_color);
            if(p.text_color)r.setProperty('--text',p.text_color);
            if(p.hint_color)r.setProperty('--text-secondary',p.hint_color);
            if(p.button_color)r.setProperty('--primary',p.button_color);
            if(p.section_separator_color)r.setProperty('--border',p.section_separator_color)}
        try{tg.onEvent('themeChanged',applyTheme)}catch(e){}
        applyTheme();

        function openDB(name){return new Promise((res,rej)=>{const r=indexedDB.open(name,VER);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE_P))d.createObjectStore(STORE_P,{keyPath:'id'});if(!d.objectStoreNames.contains(STORE_M))d.createObjectStore(STORE_M,{keyPath:'key'})}})}
        async function migrate(){return new Promise(res=>{try{const r=indexedDB.open(OLD_DB);r.onsuccess=async e=>{const old=e.target.result,neo=await openDB(NEW_DB);let mp=[],mm=null;if(old.objectStoreNames.contains(STORE_P)){const t=old.transaction(STORE_P,'readonly'),d=await new Promise(r2=>{const q=t.objectStore(STORE_P).getAll();q.onsuccess=()=>r2(q.result);q.onerror=()=>r2([])});if(d&&d.length){const n=neo.transaction(STORE_P,'readwrite');for(const i of d){if(!i.prefix)i.prefix='Я';if(!i.favorite)i.favorite=false;await n.objectStore(STORE_P).put(i)}mp=d}}if(old.objectStoreNames.contains(STORE_M)){const t=old.transaction(STORE_M,'readonly'),d=await new Promise(r2=>{const q=t.objectStore(STORE_M).getAll();q.onsuccess=()=>r2(q.result);q.onerror=()=>r2([])});if(d&&d.length){const n=neo.transaction(STORE_M,'readwrite');for(const i of d)await n.objectStore(STORE_M).put(i);mm=d}}old.close();if(mp.length||mm)indexedDB.deleteDatabase(OLD_DB);res({photos:mp,meta:mm})};r.onerror=()=>res({photos:[],meta:null})}catch(e){res({photos:[],meta:null})}})}

        async function init(){let ep=await loadPhotos()||[],em=await loadMeta('streak',null);if(!ep.length&&!em){const m=await migrate();if(m.photos.length){photos=m.photos;await savePhotos()}if(m.meta){const s=m.meta.find(x=>x.key==='streak');if(s){streak=JSON.parse(s.value);await saveMeta('streak',streak)}}}photos=await loadPhotos()||[];photos.forEach(p=>{if(!p.prefix)p.prefix='Я';if(!p.favorite)p.favorite=false});streak=await loadMeta('streak',{count:0,lastWinDate:null});winsTotal=await loadMeta('winsTotal',0);selfRatings=await loadMeta('selfRatings',{});checkStreak();renderStats();renderPhotos()}
        function getToday(){return new Date().toISOString().split('T')[0]}
        function getYesterday(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}
        function checkStreak(){const t=getToday(),y=getYesterday();if(!streak.lastWinDate)streak.count=0;else if(streak.lastWinDate!==t&&streak.lastWinDate!==y)streak.count=0;renderStats()}

        function renderStats(){const w=document.getElementById('winsBadge');if(winsTotal>0){w.textContent='🏆 '+winsTotal;w.classList.add('active')}else w.classList.remove('active');const s=document.getElementById('streakBadge');if(streak.count>0){s.textContent='🔥 '+streak.count;s.classList.add('active')}else s.classList.remove('active')}

        function switchTab(tab){document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+tab));if(tab==='progress')renderSelfTab()}

        // Сжатие фото перед сохранением: уменьшаем до 1024px и конвертируем в JPEG,
        // чтобы не упираться в квоту IndexedDB (полноразмерный DataURL весит в разы больше)
        function compressImage(dataUrl){return new Promise(res=>{const img=new Image();img.onload=()=>{const MAX=1024;const scale=Math.min(1,MAX/Math.max(img.width,img.height));if(scale>=1){res(dataUrl);return}const w=Math.round(img.width*scale),h=Math.round(img.height*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>res(dataUrl);img.src=dataUrl})}

        function handleFiles(files){const arr=Array.from(files).filter(f=>f.type.startsWith('image/'));if(!arr.length)return;let done=0;arr.forEach(file=>{const r=new FileReader();r.onload=async e=>{const dataUrl=await compressImage(e.target.result);photos.push({id:Date.now()+Math.random(),dataUrl:dataUrl,word:'',prefix:'Я',favorite:false});done++;if(done===arr.length){renderPhotos();scheduleSave()}};r.onerror=()=>{done++};r.readAsDataURL(file)});document.getElementById('fileInput').value=''}
        function scheduleSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(()=>savePhotos(),600)}
        function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
        function updateStartBtn(){document.getElementById('startBtn').disabled=!(photos.length>=4&&photos.every(p=>p.word.length>0))}
        function renderPhotos(){const g=document.getElementById('photoGrid');g.innerHTML='';photos.forEach((p,i)=>{const c=document.createElement('div');c.className='photo-card';c.innerHTML=`<button class="fav-btn ${p.favorite?'active':''}" onclick="toggleFavorite(${i},event)">★</button><button class="delete-btn" onclick="deletePhoto(${i})">×</button><div class="img-wrap"><img src="${p.dataUrl}" alt=""></div><input type="text" class="word-input" placeholder="Слово..." value="${esc(p.word)}" oninput="updateWord(${i},this.value)"><input type="text" class="word-input prefix-input" placeholder="Подсказка (Я)..." value="${esc(p.prefix||'Я')}" oninput="updatePrefix(${i},this.value)">`;g.appendChild(c)});const c=document.getElementById('counter');c.textContent='Добавлено: '+photos.length+'/4';c.classList.toggle('ready',photos.length>=4);updateStartBtn();document.getElementById('resetBtn').style.display=photos.length>0?'block':'none'}
        function updateWord(i,v){photos[i].word=v.trim();updateStartBtn();scheduleSave()}
        function updatePrefix(i,v){photos[i].prefix=v.trim();scheduleSave()}
        function toggleFavorite(i,e){e.stopPropagation();photos[i].favorite=!photos[i].favorite;renderPhotos();scheduleSave()}
        function deletePhoto(i){if(!confirm('Удалить это фото?'))return;photos.splice(i,1);renderPhotos();scheduleSave()}
        async function resetAll(){if(!confirm('Удалить все фото, слова, стрик, победы и самооценки?'))return;photos=[];streak={count:0,lastWinDate:null};winsTotal=0;selfRatings={};await clearPhotos();await saveMeta('streak',streak);await saveMeta('winsTotal',0);await saveMeta('selfRatings',selfRatings);renderStats();renderPhotos()}
        function showSaved(){const b=document.getElementById('savedBadge');b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1500)}

        function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
        function exitGame(){clearInterval(game.timer);document.getElementById('gameScreen').style.display='none';document.getElementById('setupScreen').style.display='block';switchTab('home')}

        function startGame(){if(photos.length<4)return;const total=photos.length+5;game.rounds=[];let deck=[...photos].sort(()=>Math.random()-.5);let deckIdx=0;let lastId=null;const favorites=photos.filter(p=>p.favorite);
            // Для drag-раундов нужны фото с уникальными словами, иначе пары неоднозначны
            const seen={},uniquePhotos=photos.filter(p=>{if(seen[p.word])return false;seen[p.word]=1;return true});
            let normalCount=0;for(let i=0;i<total;i++){let target;const isDrag=uniquePhotos.length>=4&&((normalCount>=5&&Math.random()<.5)||(normalCount>=8));if(isDrag){normalCount=0;const pool=[...uniquePhotos].sort(()=>Math.random()-.5).slice(0,4);const words=pool.map(p=>p.word).sort(()=>Math.random()-.5);game.rounds.push({type:'drag',photos:pool,words:words,isRetry:false});continue}normalCount++;const favAvail=favorites.filter(p=>p.id!==lastId);if(favAvail.length>0&&Math.random()<.25){target=favAvail[Math.floor(Math.random()*favAvail.length)]}else{if(deckIdx>=deck.length){deck=[...photos].sort(()=>Math.random()-.5);deckIdx=0}let safety=0;while(deck[deckIdx].id===lastId&&deck.length>1&&safety<deck.length){deckIdx++;safety++;if(deckIdx>=deck.length){deck=[...photos].sort(()=>Math.random()-.5);deckIdx=0}}target=deck[deckIdx];deckIdx++}lastId=target.id;if(Math.random()<0.3){game.rounds.push({type:'type',target:target,isRetry:false});continue}const other=photos.filter(p=>p.id!==target.id).map(p=>p.word);const dist=[];while(dist.length<3&&other.length>0){const w=other[Math.floor(Math.random()*other.length)];if(!dist.includes(w)&&w!==target.word)dist.push(w)}while(dist.length<3)dist.push('???');const words=[target.word,...dist].sort(()=>Math.random()-.5);game.rounds.push({type:'normal',target:target,words:words,isRetry:false})}game.current=0;game.processing=false;document.getElementById('setupScreen').style.display='none';document.getElementById('gameScreen').style.display='block';startRound()}

        function startRound(){if(game.current>=game.rounds.length){showWin();return}game.processing=false;const r=game.rounds[game.current];const isDrag=r.type==='drag',isType=r.type==='type';game.maxTime=(isDrag||isType)?20:12;game.timeLeft=game.maxTime;document.getElementById('roundBadge').textContent='Раунд '+(game.current+1)+' / '+game.rounds.length;renderProgress();document.getElementById('gameTitle').textContent=isDrag?'🧩 Собери пары':(isType?'✍️ Введи слово':'Найди слово');document.getElementById('hint').textContent=isDrag?'Перетащи слова к фото — или тапни слово, потом фото':(isType?'Вспомни слово и впиши его':'Какое слово подходит?');document.getElementById('hint').style.color='var(--text-secondary)';const gc=document.getElementById('gameContent');gc.innerHTML='';if(isDrag){renderDragRound(r,gc)}else if(isType){renderTypeRound(r,gc)}else{renderNormalRound(r,gc)}startTimer()}

        function renderNormalRound(r,container){container.innerHTML=`<div class="game-photo-wrap drop-zone" data-word="${esc(r.target.word)}"><img src="${r.target.dataUrl}" alt=""></div><div class="photo-prefix">${esc(r.target.prefix||'Я')}</div><div class="words-title">Выбери слово или перетащи его на фото:</div><div class="words-grid" id="wordsGrid"></div>`;const wg=document.getElementById('wordsGrid');r.words.forEach(w=>{const b=document.createElement('button');b.className='word-btn';b.textContent=w;b.dataset.word=w;b.onclick=()=>{if(Date.now()<suppressClickUntil)return;checkWord(w,b)};makeDraggable(b,{zoneSelector:'.drop-zone',tapSelect:false,onDrop:(el,zone)=>checkWord(el.dataset.word,el)});wg.appendChild(b)})}

        // TYPE ROUND: фото + ручной ввод слова
        const norm=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е');
        function renderTypeRound(r,container){container.innerHTML=`<div class="game-photo-wrap"><img src="${r.target.dataUrl}" alt=""></div><div class="photo-prefix">${esc(r.target.prefix||'Я')}</div><input type="text" id="typeInput" class="type-input" placeholder="Впиши слово..." autocomplete="off" autocapitalize="none" autocorrect="off"><button class="start-btn" id="typeCheckBtn">Проверить</button>`;
            const inp=document.getElementById('typeInput');
            inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});
            document.getElementById('typeCheckBtn').onclick=()=>checkTyped();
            setTimeout(()=>{const i2=document.getElementById('typeInput');if(i2)i2.focus()},200)}
        function checkTyped(){if(game.processing)return;const r=game.rounds[game.current];const inp=document.getElementById('typeInput');if(!inp)return;const val=norm(inp.value);if(!val)return;
            clearInterval(game.timer);game.processing=true;inp.disabled=true;document.getElementById('typeCheckBtn').disabled=true;
            if(val===norm(r.target.word)){inp.classList.add('correct');document.getElementById('hint').textContent='✅ '+(r.target.prefix||'Я')+' '+r.target.word+'!';document.getElementById('hint').style.color='var(--success)';if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');setTimeout(()=>{game.current++;startRound()},900)}
            else{inp.classList.add('wrong');document.getElementById('hint').textContent='❌ Правильный ответ: «'+r.target.word+'». Раунд повторится позже';document.getElementById('hint').style.color='var(--error)';if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');scheduleRetry();setTimeout(()=>{game.current++;startRound()},1600)}}

        function renderDragRound(r,container){game.dragMatched=0;game.dragTotal=4;dragSelected=null;const shuffledWords=[...r.words].sort(()=>Math.random()-.5);let html=`<div class="drag-grid" id="dragGrid">`;r.photos.forEach((p,idx)=>{html+=`<div class="drag-target" data-index="${idx}" data-word="${esc(p.word)}" data-id="${p.id}"><img src="${p.dataUrl}" alt=""><div class="drag-label">${esc(p.word)}</div></div>`});html+=`</div><div class="words-title">Перетащи слово на фото — или тапни слово, потом фото:</div><div class="drag-words" id="dragWords"></div>`;container.innerHTML=html;
            container.querySelectorAll('.drag-target').forEach(t=>{t.addEventListener('click',()=>{if(!dragSelected||game.processing)return;attemptMatch(t,dragSelected)})});
            const dw=document.getElementById('dragWords');shuffledWords.forEach(w=>{const d=document.createElement('div');d.className='drag-word';d.textContent=w;d.dataset.word=w;makeDraggable(d);dw.appendChild(d)})}

        // Общая проверка совпадения «слово → фото» — используется и для drag-and-drop, и для режима тапов
        function attemptMatch(dropZone,el){const correctWord=dropZone.dataset.word;const draggedWord=el.dataset.word;
            if(correctWord===draggedWord){dropZone.classList.add('correct');el.classList.add('matched');el.classList.remove('selected');if(dragSelected===el)dragSelected=null;game.dragMatched++;if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');if(game.dragMatched>=game.dragTotal){clearInterval(game.timer);setTimeout(()=>{game.current++;startRound()},600)}return true}
            dropZone.classList.add('wrong');if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');setTimeout(()=>dropZone.classList.remove('wrong'),400);return false}

        // Универсальное перетаскивание: opts.zoneSelector — что считать целью,
        // opts.tapSelect — включать ли режим тапов (выбор слова), opts.onDrop — что делать при дропе.
        // Конвенция: onDrop вызывается как onDrop(draggedElement, dropZone) и возвращает true при успехе.
        function makeDraggable(el,opts){opts=opts||{};const zoneSelector=opts.zoneSelector||'.drag-target';const tapSelect=opts.tapSelect!==false;const onDrop=opts.onDrop||((draggedEl,zone)=>attemptMatch(zone,draggedEl));
            let startX,startY,dragging=false,moved=false,clone=null,lastZone=null;
            // В touchend список e.touches УЖЕ ПУСТОЙ, но сам объект существует (truthy) —
            // changedTouches надёжно содержит точку во всех touch-событиях.
            const getPoint=e=>{if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0];if(e.touches&&e.touches.length)return e.touches[0];return e};
            const zoneAt=(x,y)=>{const n=document.elementFromPoint(x,y);return n?n.closest(zoneSelector):null};
            let rect=null;
            const ensureClone=()=>{if(clone)return;clone=el.cloneNode(true);clone.style.position='fixed';clone.style.left=rect.left+'px';clone.style.top=rect.top+'px';clone.style.width=rect.width+'px';clone.style.margin='0';clone.style.zIndex='9999';clone.style.pointerEvents='none';
                clone.style.transition='none';clone.style.transform='translate(0px,0px)';clone.style.willChange='transform';
                document.body.appendChild(clone);el.style.opacity='0.3'};
            const onMove=e=>{if(!dragging)return;if(e.cancelable)e.preventDefault();const t=getPoint(e);if(!t)return;
                const dx=t.clientX-startX,dy=t.clientY-startY;
                // Клон создаётся только когда палец реально сдвинулся — при простом тапе ничего не мерцает
                if(Math.abs(dx)>6||Math.abs(dy)>6){moved=true;ensureClone()}
                if(!clone)return;
                // Двигаем через transform (GPU), а не left/top — иначе лаги от пересчёта layout
                clone.style.transform='translate('+dx+'px,'+dy+'px)';
                const zone=zoneAt(t.clientX,t.clientY);if(zone!==lastZone){if(lastZone)lastZone.classList.remove('highlight');if(zone)zone.classList.add('highlight');lastZone=zone}};
            const onEnd=e=>{if(!dragging)return;dragging=false;
                document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
                if(lastZone){lastZone.classList.remove('highlight');lastZone=null}
                if(clone){clone.remove();clone=null}
                const t=getPoint(e);
                if(!t){el.style.opacity='1';return}
                if(moved)suppressClickUntil=Date.now()+300;else{el.style.opacity='1';return}
                const dropZone=zoneAt(t.clientX,t.clientY);
                // При успешном совмещении НЕ восстанавливаем opacity — слово исчезает сразу,
                // без анимации «возврата» на исходное место
                if(dropZone&&onDrop(el,dropZone)===true){el.style.transition='none';el.style.opacity='0';requestAnimationFrame(()=>{el.style.transition=''})}
                else el.style.opacity='1'};

                // preventDefault только для мыши (от выделения текста). Для тача не нужен:
                // touch-action:none сам запрещает скролл, а preventDefault на touchstart

                dragging=true;moved=false;startX=t.clientX;startY=t.clientY;rect=el.getBoundingClientRect();
                document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd)};
            el.addEventListener('touchstart',start,{passive:false});
            el.addEventListener('touchmove',onMove,{passive:false});
            el.addEventListener('touchend',onEnd);
            el.addEventListener('touchcancel',onEnd);
            el.addEventListener('mousedown',start);
            // Режим тапов: тап по слову выбирает его, тап по фото — совмещает
            el.addEventListener('click',()=>{if(!tapSelect||Date.now()<suppressClickUntil||game.processing||el.classList.contains('matched'))return;

                if(dragSelected)dragSelected.classList.remove('selected');
                dragSelected=el;el.classList.add('selected');if(tg.HapticFeedback&&tg.HapticFeedback.selectionChanged)tg.HapticFeedback.selectionChanged()})}

        function renderProgress(){const b=document.getElementById('progressBar');b.innerHTML='';game.rounds.forEach((r,i)=>{const d=document.createElement('div');d.className='progress-dot';if(i<game.current)d.classList.add('done');else if(i===game.current)d.classList.add('active');if(r.isRetry)d.style.background='#f39c12';if(r.type==='drag'){d.classList.add('drag')}if(r.type==='type'){d.classList.add('type')}b.appendChild(d)})}

        function startTimer(){clearInterval(game.timer);const f=document.getElementById('timerFill');f.style.width='100%';f.className='timer-fill';game.timer=setInterval(()=>{game.timeLeft-=.1;const p=Math.max(0,(game.timeLeft/game.maxTime)*100);f.style.width=p+'%';if(game.timeLeft<=game.maxTime*.4)f.classList.add('warning');if(game.timeLeft<=game.maxTime*.2)f.classList.add('danger');if(game.timeLeft<=0){clearInterval(game.timer);handleTimeout()}},100)}

        function handleTimeout(){if(game.processing)return;game.processing=true;document.getElementById('hint').textContent='⏰ Время вышло! Раунд повторится позже';document.getElementById('hint').style.color='var(--error)';if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');scheduleRetry();setTimeout(()=>{game.current++;startRound()},1200)}

        function checkWord(word,btn){if(game.processing)return false;clearInterval(game.timer);game.processing=true;const r=game.rounds[game.current];const ok=word===r.target.word;document.querySelectorAll('.word-btn').forEach(b=>b.disabled=true);if(ok){btn.classList.add('correct');document.getElementById('hint').textContent='✅ '+(r.target.prefix||'Я')+' '+word+'!';document.getElementById('hint').style.color='var(--success)';if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');setTimeout(()=>{game.current++;startRound()},900);return true}btn.classList.add('wrong');document.getElementById('hint').textContent='❌ Неправильно. Раунд повторится позже';document.getElementById('hint').style.color='var(--error)';if(tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');scheduleRetry();setTimeout(()=>{game.current++;startRound()},1200);return false}

        function showWin(){onWin();document.getElementById('winTitle').textContent='🎉 Победа!';document.getElementById('winText').textContent='Ты прошёл все раунды! 🔥 Streak: '+streak.count+' | 🏆 Побед: '+winsTotal;document.getElementById('winModal').classList.add('active');launchConfetti()}

        function launchConfetti(){const colors=['#2481cc','#e74c3c','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c'];for(let i=0;i<60;i++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[Math.floor(Math.random()*colors.length)];e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.8+'s';e.style.width=(6+Math.random()*6)+'px';e.style.height=(6+Math.random()*6)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}

        // ===== Самооценка (вкладка «Прогресс») =====
        function getSelfWords(){const seen=[];photos.forEach(p=>{const w=p.word;if(w&&!seen.includes(w))seen.push(w)});return seen}
        function dayAvg(d){const o=selfRatings[d];if(!o)return null;const vals=Object.values(o).filter(v=>v>0);if(!vals.length)return null;return vals.reduce((a,b)=>a+b,0)/vals.length}
        function prevRatingFor(word){const today=getToday();const dates=Object.keys(selfRatings).filter(d=>d<today).sort();for(let i=dates.length-1;i>=0;i--){const v=selfRatings[dates[i]][word];if(v)return v}return null}
        function renderSelfTab(){
            const words=getSelfWords(),today=getToday(),todayData=selfRatings[today]||{};
            const sum=document.getElementById('selfSummary'),hist=document.getElementById('selfHistory'),list=document.getElementById('selfList');
            if(!words.length){sum.innerHTML='';hist.innerHTML='';list.innerHTML='<div class="self-empty">Сначала добавь фото и слова на вкладке «Главная» —<br>здесь появятся твои качества для самооценки.</div>';return}
            // Сводка
            const tAvg=dayAvg(today);
            const prevDates=Object.keys(selfRatings).filter(d=>d<today&&dayAvg(d)!=null).sort();
            const pAvg=prevDates.length?dayAvg(prevDates[prevDates.length-1]):null;
            let sumHtml='<div class="self-summary-title">Как ты сегодня себя ощущаешь?</div><div class="self-summary-sub">Оцени соответствие каждому слову от 1 до 10</div>';
            if(tAvg!=null)sumHtml+='<div class="self-avg">Сегодня: <b>'+tAvg.toFixed(1)+'</b>'+(pAvg!=null?' <span class="'+(tAvg>=pAvg?'up':'down')+'">'+(tAvg>=pAvg?'▲':'▼')+' (было '+pAvg.toFixed(1)+')</span>':'')+'</div>';
            sum.innerHTML=sumHtml;
            // История за 7 дней
            const days=[];for(let i=6;i>=0;i--)days.push(new Date(Date.now()-i*864e5).toISOString().split('T')[0]);
            hist.innerHTML='<div class="self-hist-title">Средняя самооценка по дням</div><div class="self-hist-row">'+days.map(d=>{const a=dayAvg(d);const h=a!=null?Math.max(4,Math.round(a*10)):0;return '<div class="self-hist-col"><div class="self-hist-bar-wrap"><div class="self-hist-bar'+(d===today?' today':'')+'" style="height:'+h+'%"></div></div><div class="self-hist-day">'+d.slice(8)+'.'+d.slice(5,7)+'</div></div>'}).join('')+'</div>';
            // Список слов со слайдерами
            list.innerHTML='';
            words.forEach((w,i)=>{
                const val=todayData[w]||0,prev=prevRatingFor(w);
                const card=document.createElement('div');card.className='self-card';
                card.innerHTML='<div class="self-head"><span class="self-word">'+esc(w)+'</span><span class="self-val" id="selfVal'+i+'">'+(val||'—')+'</span></div>'+
                    '<input type="range" min="1" max="10" step="1" value="'+(val||5)+'" class="self-slider" id="selfSlider'+i+'">'+
                    '<div class="self-scale"><span>1</span><span>5</span><span>10</span></div>'+
                    (prev!=null?'<div class="self-prev">прошлая оценка: '+prev+'</div>':'');
                list.appendChild(card);
                const slider=document.getElementById('selfSlider'+i),bubble=document.getElementById('selfVal'+i);
                slider.addEventListener('input',()=>{bubble.textContent=slider.value});
                slider.addEventListener('change',()=>{
                    if(!selfRatings[today])selfRatings[today]={};
                    selfRatings[today][w]=+slider.value;
                    if(selfSaveTimer)clearTimeout(selfSaveTimer);
                    selfSaveTimer=setTimeout(async()=>{await saveMeta('selfRatings',selfRatings);showSaved();renderSelfTab()},400);
                });
            });
        }

        // ===== Перенос данных между устройствами (без сервера) =====
        function exportData(){
            if(!photos.length&&!winsTotal&&!streak.count){showToast('Пока нечего экспортировать');return}
            const data={app:'associations',version:1,exportedAt:new Date().toISOString(),photos:photos,streak:streak,winsTotal:winsTotal,selfRatings:selfRatings};
            const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='associations-backup-'+getToday()+'.json';
            document.body.appendChild(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(url),5000);
            showToast('📤 Файл сохранён — отправь его себе в «Избранное» в Telegram')
        }
        async function importData(input){
            const file=input.files[0];input.value='';if(!file)return;
            try{
                const data=JSON.parse(await file.text());
                if(!data||data.app!=='associations'||!Array.isArray(data.photos))throw new Error('bad file');
                if(!confirm('Импортировать '+data.photos.length+' фото и статистику?\nТекущие данные на этом устройстве будут заменены.'))return;
                photos=data.photos.filter(p=>p&&p.dataUrl).map(p=>({id:p.id||Date.now()+Math.random(),dataUrl:p.dataUrl,word:String(p.word||''),prefix:String(p.prefix||'Я'),favorite:!!p.favorite}));
                if(data.streak&&typeof data.streak==='object')streak={count:data.streak.count|0,lastWinDate:data.streak.lastWinDate||null};
                if(typeof data.winsTotal==='number')winsTotal=data.winsTotal;
                if(data.selfRatings&&typeof data.selfRatings==='object')selfRatings=data.selfRatings;
                await savePhotos();await saveMeta('streak',streak);await saveMeta('winsTotal',winsTotal);await saveMeta('selfRatings',selfRatings);
                checkStreak();renderStats();renderPhotos();
                showToast('✅ Импортировано: '+photos.length+' фото')
            }catch(e){showToast('❌ Не удалось прочитать файл бэкапа')}
        }

        init();
    </script>
</body>
</html>
